name: Release

# Disabled for now, alongside tagAndRelease.yml — this repo has no release
# registry/S3 destination or signing key configured yet, and this workflow
# only ever fires from a tag tagAndRelease.yml creates, which is itself
# disabled. See the comment there for what to configure before re-enabling
# the `push:` trigger below.
on:
  workflow_dispatch:
  # push:
  #   tags:
  #     - 'v*.*'

jobs:
  release:
    uses: Start9Labs/start-technologies/.github/workflows/release.yml@master
    with:
      RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
      S3_S9PKS_BASE_URL: ${{ vars.S3_S9PKS_BASE_URL }}
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
    permissions:
      contents: write
